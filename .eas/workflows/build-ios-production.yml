name: Build iOS production and submit to TestFlight

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Submit to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      submit_beta_review: false
      changelog: "Build 90: Registered affirmation notification actions at launch, repaired completion lookup, lifted task entry above the keyboard, and aligned dark-mode Next Up color."
