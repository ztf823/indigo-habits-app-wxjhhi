name: Build iOS production and submit to TestFlight

on:
  workflow_dispatch: {}

defaults:
  tools:
    node: 22.23.1

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Submit to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      submit_beta_review: false
      changelog: "Bug fixes and improvements for Indigo Habits."
