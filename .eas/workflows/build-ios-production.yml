name: Build iOS production and submit to TestFlight

on:
  workflow_dispatch:
    inputs:
      existing_build_id:
        type: string
        required: false
        default: ''
        description: 'Optional successful EAS build ID; retry submission without rebuilding.'

defaults:
  tools:
    node: 22.23.1

jobs:
  build_ios:
    if: ${{ !inputs.existing_build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Submit to TestFlight
    type: testflight
    after: [build_ios]
    if: ${{ inputs.existing_build_id || after.build_ios.status == 'success' }}
    params:
      build_id: ${{ inputs.existing_build_id || after.build_ios.outputs.build_id }}
      profile: production
      submit_beta_review: false
      changelog: "Build 94: Verify current subscription entitlements and refresh Premium plan presentation."
