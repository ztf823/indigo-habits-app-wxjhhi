name: Capture Build 95 iPad screenshots
on:
  push:
    branches: [build95-ipad-screenshots]
    paths: [.github/workflows/capture-ipad.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2de04a273031d07c5c1a1315d8f74cdfa90d154b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: Build95-iPad-capture-5
          run-id: 38750350792
          github-token: ${{ github.token }}
      - name: Restore exact compiled simulator app
        run: ditto -x -k Build95-Simulator-App.zip restored
      - name: Boot 13-inch iPad and install
        run: |
          set -e
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY'
          import json, os
          devices=json.load(open('devices.json'))['devices']
          candidates=[d for runtime, entries in sorted(devices.items(), reverse=True) if 'iOS' in runtime for d in entries if 'iPad Pro 13' in d['name'] or 'iPad Pro (12.9-inch)' in d['name']]
          if not candidates: raise SystemExit('No 13-inch iPad simulator available')
          device=candidates[0]
          open('capture-device.txt','w').write(device['udid'])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CAPTURE_DEVICE='+device['udid']+'\n')
          print(device['name'])
          PY
          xcrun simctl boot "$(cat capture-device.txt)"
          xcrun simctl bootstatus "$(cat capture-device.txt)" -b
          open -a Simulator
          xcrun simctl ui "$(cat capture-device.txt)" appearance light
          xcrun simctl status_bar "$(cat capture-device.txt)" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$(cat capture-device.txt)" restored/IndigoHabits.app
      - name: Capture actual app UI
        run: |
          set -e
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          mkdir -p screenshots
          cat > capture.yaml <<'YAML'
          appId: com.indigohabits.journal2026
          ---
          - launchApp:
              clearState: true
          - tapOn:
              text: "Allow"
              optional: true
          - tapOn:
              text: "Let's Get Started"
              optional: true
          - tapOn:
              text: "Allow"
              optional: true
          - waitForAnimationToEnd
          - takeScreenshot: screenshots/Indigo_Habits_iPad_01_Home
          - tapOn: "Habits"
          - waitForAnimationToEnd
          - takeScreenshot: screenshots/Indigo_Habits_iPad_02_Habits
          - tapOn: "Calendar"
          - waitForAnimationToEnd
          - takeScreenshot: screenshots/Indigo_Habits_iPad_03_Calendar
          - tapOn: "History"
          - waitForAnimationToEnd
          - takeScreenshot: screenshots/Indigo_Habits_iPad_04_History
          - tapOn: "Home"
          - tapOn: "Open journal.*"
          - waitForAnimationToEnd
          - takeScreenshot: screenshots/Indigo_Habits_iPad_05_Journal
          YAML
          python3 - <<'PYINIT'
          from pathlib import Path
          s=Path('capture.yaml').read_text()
          Path('initialize.yaml').write_text(s[:s.index('- takeScreenshot:')])
          Path('capture.yaml').write_text(s[s.index('appId:'):].replace('clearState: true','clearState: false').replace('- extendedWaitUntil:\n    visible: "Let\'s Get Started"\n    timeout: 60000\n- tapOn: "Let\'s Get Started"\n',''))
          PYINIT
          "$HOME/.maestro/bin/maestro" --udid "$CAPTURE_DEVICE" test initialize.yaml || true
          xcrun simctl io "$CAPTURE_DEVICE" screenshot screenshots/diagnostic-startup.png
          xcrun simctl terminate "$CAPTURE_DEVICE" com.indigohabits.journal2026
          python3 - <<'PYSEED'
          import json, sqlite3, os, subprocess
          from pathlib import Path
          from datetime import date, timedelta
          container=Path(subprocess.check_output(['xcrun','simctl','get_app_container',os.environ['CAPTURE_DEVICE'],'com.indigohabits.journal2026','data'],text=True).strip())
          dbs=list(container.rglob('indigo_habits.db'))
          assert len(dbs)==1, dbs
          con=sqlite3.connect(dbs[0])
          today=date.today().isoformat()
          con.execute("INSERT OR REPLACE INTO profile (id,name,email,quote,isPremium) VALUES ('default','Alex','','Small steps every day',0)")
          habits=[('water','Drink a glass of water','#06B6D4','07:00'),('walk','Take a morning walk','#6366F1','07:30'),('read','Read for 20 minutes','#8B5CF6','20:00')]
          for i,(hid,title,color,time) in enumerate(habits):
              con.execute('INSERT OR REPLACE INTO habits (id,title,color,isActive,isRepeating,orderIndex) VALUES (?,?,?,1,1,?)',(hid,title,color,i))
              for back in range(7):
                  d=(date.today()-timedelta(days=back)).isoformat()
                  if back>0 or hid=='water': con.execute('INSERT OR REPLACE INTO habit_completions (id,habitId,date,completed) VALUES (?,?,?,1)',(hid+d,hid,d))
          con.execute('INSERT OR REPLACE INTO journal_entries (id,content,date,createdAt) VALUES (?,?,?,?)',('demo-journal','I started the morning with a walk and a clear plan. Making time to read helped me slow down. Tomorrow I want to keep taking small steps toward my goals.',today,today+'T08:00:00.000Z'))
          for i,t in enumerate(['I am building a life I love.','I follow through on my goals.','Small steps lead to lasting change.']): con.execute('INSERT OR REPLACE INTO affirmations (id,text,isCustom,isFavorite,orderIndex) VALUES (?,?,1,1,?)',('demo'+str(i),t,i))
          con.commit(); con.close()
          paths=list(container.rglob('manifest.json'))
          paths=[p for p in paths if 'RCTAsyncLocalStorage' in str(p)]
          if not paths:
              p=container/"Library"/"Application Support"/"com.indigohabits.journal2026"/"RCTAsyncLocalStorage_V1"/"manifest.json"
              p.parent.mkdir(parents=True,exist_ok=True); p.write_text("{}"); paths=[p]
          assert len(paths)==1, paths
          manifest=paths[0]; data=json.loads(manifest.read_text())
          data['@indigo_habits/habit_schedules_v1']=json.dumps({hid:{'days':list(range(7)),'time':time,'reminderEnabled':False,'paused':False} for hid,title,color,time in habits},separators=(',',':'))
          data['@indigo_habits/planned_items_v1']=json.dumps([{'id':'demo-task','title':'Plan tomorrow','date':today,'time':'18:00','completed':False,'reminderEnabled':False,'createdAt':today+'T08:00:00Z'}],separators=(',',':'))
          manifest.write_text(json.dumps(data))
          print('Seeded local simulator example data without changing app code')
          PYSEED
          "$HOME/.maestro/bin/maestro" --udid "$CAPTURE_DEVICE" test capture.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build95-iPad-capture-${{ github.run_number }}
          path: |
            screenshots/
            ~/.maestro/tests/
            Build95-Simulator-App.zip
            xcodebuild.log
            devices.json
          retention-days: 30
